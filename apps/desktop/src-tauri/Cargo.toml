[package]
name = "farflow-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FarFlow 研流桌面客户端"

[workspace]
resolver = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
farflow-core = { path = "../../../crates/core" }
farflow-desktop = { path = "../../../crates/desktop" }
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-http = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication"] }

[dev-dependencies]
tauri = { version = "=2.11.6", features = ["test"] }
tempfile = "3.27"
